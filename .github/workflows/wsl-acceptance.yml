name: Opt-in real WSL handoff
on:
  workflow_dispatch:
    inputs:
      distro:
        description: Existing WSL 2 distribution with matching Linux Zevria installed
        type: string
        required: true

# Separate from mocked tests. This host is provisioned by its owner; the job
# must never install/upgrade/shut down WSL or change the default distribution.
jobs:
  handoff:
    runs-on: [self-hosted, Windows, X64, zevria-wsl2]
    timeout-minutes: 15
    env:
      ZEVRIA_WSL_ACCEPTANCE_DISTRO: ${{ inputs.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: Real whole-application handoff in disposable paths
        shell: pwsh
        run: cargo test --locked -p zevria --test wsl_acceptance -- --ignored --nocapture
