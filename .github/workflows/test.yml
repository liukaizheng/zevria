name: Cross-platform checks
on:
  push:
    branches: ['**'] # Version-tag pushes are handled by release.yml.
  pull_request:
  workflow_dispatch:
    inputs:
      desktop_dev_zip:
        description: Build and smoke-test the Windows Desktop dev ZIP instead of running the test matrices
        type: boolean
        default: false

jobs:
  installers:
    if: github.event_name != 'workflow_dispatch' || !inputs.desktop_dev_zip
    name: Offline installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Verify the release bundle and draft asset contracts
        run: python tests/install/test_release_contract.py
      - name: System Bash syntax and offline fixtures (including macOS Bash 3.2)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          /bin/bash -n install.sh tests/install/transport.sh
          INSTALL_TEST_BASH=/bin/bash python tests/install/test_unix.py
      - name: Install ShellCheck and fish on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck fish
      - name: Install ShellCheck and fish on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck fish
      - name: ShellCheck and fish profile execution
        if: runner.os != 'Windows'
        shell: bash
        run: |
          shellcheck install.sh tests/install/transport.sh
          INSTALL_TEST_BASH=/bin/bash python tests/install/test_unix.py
      - name: Windows PowerShell 5.1 fixtures (mocked registry)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/install/test_helpers.ps1
          ./tests/install/test_windows.ps1
      - name: PowerShell 7 fixtures (mocked registry)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/install/test_helpers.ps1
          ./tests/install/test_windows.ps1

  workspace:
    if: github.event_name != 'workflow_dispatch' || !inputs.desktop_dev_zip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install RTK for command-environment tests
        # Explicit CI setup, never performed by the application launcher.
        # RTK v0.49.0 provides the raw `run` command required by inspection fixtures.
        # Keep aligned with release.yml; never resolve RTK's moving default branch.
        run: cargo install --git https://github.com/rtk-ai/rtk --rev b1c0dc00649c50fbe8930f849c800d4d6ca12091 --locked
      - name: Verify RTK version and raw run support
        run: |
          python - <<'PY'
          import subprocess

          def probe(arguments, expected_status, expected_stdout=None):
              command = ['rtk', *arguments]
              guidance = 'Ensure the pinned RTK v0.49.0 binary is first on PATH.'
              try:
                  result = subprocess.run(command, stdin=subprocess.DEVNULL, capture_output=True,
                                          text=True, timeout=15)
              except subprocess.TimeoutExpired as error:
                  raise SystemExit(f'RTK CI prerequisite failed: {command!r} timed out after {error.timeout}s; '
                                   f'stdout={error.stdout!r}; stderr={error.stderr!r}. {guidance}') from error
              except OSError as error:
                  raise SystemExit(f'RTK CI prerequisite failed: cannot execute {command!r}: {error}. '
                                   f'{guidance}') from error
              actual = f'{command!r}: exit status {result.returncode}; stdout={result.stdout!r}; stderr={result.stderr!r}'
              # text=True normalizes native Windows CRLF output before comparison.
              if result.returncode != expected_status or (expected_stdout is not None and result.stdout != expected_stdout):
                  raise SystemExit(f'RTK CI prerequisite failed: {actual}; expected exit status {expected_status}'
                                   f' and stdout={expected_stdout!r} (None means unchecked). {guidance}')
              print(actual, flush=True)

          probe(['--version'], 0, 'rtk 0.49.0\n')
          probe(['run', 'echo ZEVRIA_RTK_RUN_OK'], 0, 'ZEVRIA_RTK_RUN_OK\n')
          probe(['run', 'exit 7'], 7)
          PY
      - name: Verify Git Bash on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw 'Git for Windows is required by native tests' }
          "ZEVRIA_GIT_BASH=$bash" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --release --workspace --all-targets --exclude zevria-desktop
      - name: Check Desktop (release profile)
        run: cargo check --locked --release -p zevria-desktop --all-targets --features fixtures
      - name: Test Desktop (release profile)
        run: cargo test --locked --release -p zevria-desktop
      - name: Keep GPUI and RaTeX out of the CLI and Linux Desktop stub
        run: |
          packages=(-p zevria)
          if [[ "$RUNNER_OS" == Linux ]]; then packages+=(-p zevria-desktop); fi
          tree=$(cargo tree --locked --edges normal --prefix none "${packages[@]}")
          if grep -Eq '^(gpui|ratex)' <<< "$tree"; then
            printf '%s\n' "$tree"
            exit 1
          fi
      - name: Build the real executable used by ACP process fixtures
        # Test the optimized CLI that ships, not an unoptimized debug executable.
        run: cargo build --locked --release -p zevria
      - name: Test the locked workspace
        if: runner.os != 'Windows'
        run: cargo test --locked --release --workspace --exclude zevria-desktop
      - name: Test remaining workspace packages on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked --release --workspace --exclude zevria-ensemble --exclude zevria-desktop
      - name: Test ensemble subprocess fixtures serially on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked --release -p zevria-ensemble -- --test-threads=1
      - name: Provider continuation and cache-prefix feature regressions
        run: cargo test --locked --release -p zevria-provider -p zevria-host --features cache-diagnostics

  windows-desktop-dev-zip:
    name: Windows x64 Desktop development ZIP (build only)
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_dev_zip
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Build and smoke-test the extracted ZIP
        run: python tools/package-windows-desktop.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zevria-desktop-dev-x86_64-pc-windows-msvc-${{ github.sha }}
          path: target/desktop-dev/zevria-desktop-dev-x86_64-pc-windows-msvc-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7
