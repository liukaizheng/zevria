[package]
name = "zevria-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
zevria-host = { workspace = true }
zevria-presentation = { workspace = true }
zevria-session-api = { workspace = true }
zevria-foundation = { workspace = true }
zevria-content = { workspace = true }
zevria-model = { workspace = true }
zevria-workflow = { workspace = true }
zevria-transcript = { workspace = true }
zevria-instructions = { workspace = true }
zevria-theme = { workspace = true }
anyhow = { workspace = true }
rig-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# GPUI is validated only on macOS; other targets build the GPUI-free model and a stub binary.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-kit = { workspace = true, features = ["syntect"] }
tracing-appender = { workspace = true }

[dev-dependencies]
zevria-host = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
