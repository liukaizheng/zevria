[package]
name = "zevria-desktop"
version.workspace = true
edition.workspace = true

[features]
# Opt-in, provider-free controller fixtures for the native screenshot gallery.
fixtures = []

[[test]]
name = "gallery"
harness = false
test = false
required-features = ["fixtures"]

[dependencies]
zevria-host = { workspace = true }
zevria-presentation = { workspace = true }
zevria-session-api = { workspace = true }
zevria-foundation = { workspace = true }
zevria-content = { workspace = true }
zevria-model = { workspace = true }
zevria-workflow = { workspace = true }
zevria-transcript = { workspace = true }
zevria-instructions = { workspace = true }
zevria-theme = { workspace = true }
anyhow = { workspace = true }
rig-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Linux and other unsupported targets build the GPUI-free model and a stub binary.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
gpui-kit = { workspace = true, features = ["syntect"] }
tracing-appender = { workspace = true }
ratex-parser = { workspace = true }
ratex-layout = { workspace = true }
ratex-types = { workspace = true }
ratex-font = { workspace = true }
ratex-katex-fonts = { workspace = true }
tiny-skia = { workspace = true }
ttf-parser = { workspace = true }
image = { workspace = true, features = ["bmp", "tiff"] }

[target.'cfg(windows)'.dependencies]
# Use Kit's locked backend directly for its fallible startup constructor.
gpui-windows = { package = "gpui-pre-windows", version = "=0.3.14" }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
image = { workspace = true }
markdown = { workspace = true }
zevria-host = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
